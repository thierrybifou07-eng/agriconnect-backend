  /admin/ai/status:
    get:
      tags:
      - IA
      summary: État du moteur IA
      security:
      - bearerAuth: []
      responses:
        '200':
          description: État du fournisseur et du modèle configuré
          content:
            application/json:
              schema:
                type: object
                required:
                - enabled
                - provider
                - baseUrl
                - model
                - reachable
                - modelInstalled
                - authenticated
                - capabilities
                - lastLatencyMs
                - queue
                - autonomousEnabled
                - quota
                properties:
                  enabled:
                    type: boolean
                  provider:
                    type: string
                    enum:
                    - ollama
                    - gemini
                  baseUrl:
                    type: string
                    format: uri
                    nullable: true
                  model:
                    type: string
                    nullable: true
                  reachable:
                    type: boolean
                  modelInstalled:
                    type: boolean
                  authenticated:
                    type: boolean
                    nullable: true
                  capabilities:
                    type: array
                    items:
                      type: string
                  lastLatencyMs:
                    type: integer
                    nullable: true
                  queue:
                    type: object
                    properties:
                      pending:
                        type: integer
                      running:
                        type: integer
                  autonomousEnabled:
                    type: boolean
                  quota:
                    type: object
                    nullable: true
                    properties:
                      maxRpm:
                        type: integer
                      dailyBudget:
                        type: integer
                      usedToday:
                        type: integer
                      resetsAt:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/ai/test:
    post:
      tags:
      - IA
      summary: Teste une génération structurée sur le fournisseur actif
      security:
      - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: Génération structurée validée par la garde de sortie
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - latencyMs
                - output
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  latencyMs:
                    type: integer
                    minimum: 0
                  output:
                    type: object
                    required:
                    - intent
                    - language
                    - confidence
                    - needs_human
                    - reply
                    - reasons
                    - warnings
                    properties:
                      intent:
                        type: string
                        enum:
                        - PRODUCT_QUESTION
                        - PRICE_QUOTE_REQUEST
                        - DELIVERY_QUESTION
                        - VERIFICATION_STATUS
                        - COMPLAINT
                        - OTHER
                      language:
                        type: string
                        enum:
                        - fr
                        - en
                      confidence:
                        type: number
                        minimum: 0
                        maximum: 1
                      needs_human:
                        type: boolean
                      reply:
                        type: string
                        maxLength: 800
                      reasons:
                        type: array
                        maxItems: 5
                        items:
                          type: string
                          maxLength: 160
                      warnings:
                        type: array
                        items:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Moteur IA désactivé
          content:
            application/json:
              schema: &a6
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota dépassé
          content:
            application/json:
              schema: *a6
        '502':
          description: Fournisseur IA inaccessible, modèle absent ou sortie invalide
          content:
            application/json:
              schema: *a6
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token JWT — en-tête Authorization: Bearer <token>'
  parameters:
    IdParam:
      in: path
      name: id
      required: true
      description: Identifiant entier (coerceIdParam convertit la chaîne)
      schema:
        type: integer
    TokenParam:
      in: query
      name: token
      required: true
      description: Jeton à usage unique (hex de 80 caractères)
      schema:
        type: string
        pattern: ^[a-f0-9]{80}$
    LegalCodeParam:
      in: path
      name: code
      required: true
      schema:
        type: string
        enum:
        - CGU
        - BUYER_TERMS
        - SUPPLIER_CONSIGNMENT_TERMS
    PageParam:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Corps invalide (Joi)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token absent, invalide ou expiré
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Rôle, capacité ou privilège insuffisant ; compte suspendu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenProfileNotVerified:
      description: Rôle insuffisant, ou profil non vérifié (PROFILE_NOT_VERIFIED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfileNotVerifiedError'
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UploadBadRequest:
      description: "Requête d'upload refusée : UNEXPECTED_FILE_FIELD (mauvais nom de champ ou trop de fichiers — expectedField renseigne le champ attendu), INVALID_MULTIPART (requête mal formée), UNSUPPORTED_MEDIA_TYPE (format refusé), FILE_REQUIRED (aucun fichier) ou FILE_CONTENT_MISMATCH (les octets ne correspondent pas au format annoncé)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UploadError'
    FileTooLarge:
      description: FILE_TOO_LARGE — fichier au-delà de la taille maximale du champ attendu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UploadError'
    TooManyPendingDocuments:
      description: TOO_MANY_PENDING_DOCUMENTS — 5 documents au statut PENDING pour ce compte
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaginatedVerifications:
      description: Dossiers paginés { items, page, limit, total }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedPayouts:
      description: Reversements paginés
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedCategories:
      description: Catégories paginées
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedUnits:
      description: Unités paginées
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedProducts:
      description: Produits paginés
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedZones:
      description: Zones paginées
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedHubs:
      description: Points de dépôt paginés
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedAgencies:
      description: Agences paginées
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedSupplierLots:
      description: Lots du fournisseur paginés
      content:
        application/json:
          schema:
