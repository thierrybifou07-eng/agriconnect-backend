    PaginatedReferrals:
      description: Parrainages paginés
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedCompensations:
      description: Indemnisations (admin) paginées
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/Compensation'
              page:
