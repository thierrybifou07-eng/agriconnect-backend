          - INACTIVE
      - in: query
        name: productId
        schema:
          type: integer
      - in: query
        name: supplierId
        schema:
          type: integer
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
