                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                agreedUnitPrice:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                quantity:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
