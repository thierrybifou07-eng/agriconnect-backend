openapi: 3.0.0
info:
  title: AgriConnect API v2
  version: 2.0.0
  description: 'API REST + WebSocket AgriConnect — consignation de lots agricoles.


    Trois couches : le promoteur (SUPPLIER) déclare des **lots** (StockLot, interne), l''équipe (AGENT/ADMIN) publie des **annonces** (Listing, prix public) et l''acheteur (BUYER) ne voit que les annonces. Le lot relié à une annonce est figé dans ListingLot ; une ligne de commande (OrderItem) reprend les deux identifiants et les prix au moment de la vente.


    Montants et quantités : `Decimal` Prisma, convertis en nombre JSON par decimal-json.middleware.js. Identifiants : entiers (`Int @id`).'
  contact:
    name: AgriConnect
servers:
- url: /api/v2
  description: Préfixe de l'API (monté dans src/app.js)
tags:
- name: Auth
  description: Authentification, sessions et récupération de compte
- name: Utilisateur
  description: Profil, comptes de paiement, documents et parrainage de l'utilisateur connecté
- name: Admin
  description: Administration (ADMIN et ROOT, capacités agent)
- name: CGU
  description: Conditions d'utilisation versionnées, publiques
- name: Fournisseur
  description: Lots déclarés par le promoteur connecté
- name: Équipe
  description: Validation des lots, annonces, commandes, paiements, livraisons, indemnisations (AGENT par capacité, ADMIN/ROOT)
- name: Catalogue
  description: Consultation du catalogue par l'acheteur
- name: Conversations
  description: Messagerie client <-> équipe
- name: Commandes
  description: Cycle de vie de la commande côté acheteur
- name: Livreur
  description: Courses du livreur connecté
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Inscription publique (SUPPLIER ou BUYER)
      description: Crée le compte, son profil, l'acceptation des CGU requises pour le rôle et éventuellement le parrainage. Ouvre une session (access + refresh token). ADMIN, AGENT, DRIVER et ROOT ne sont jamais acceptés ici.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstname:
                  type: string
                  minLength: 2
                lastname:
                  type: string
                  minLength: 2
                phone:
                  type: string
                  pattern: ^\+?[0-9]{8,15}$
                email:
                  type: string
                  format: email
                password:
                  type: string
                  pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])(?!.*(.)\1\1\1)[A-Za-z\d@$!%*?&]{8,}$
                role:
                  type: string
                  enum:
                  - SUPPLIER
                  - BUYER
                location:
                  type: string
                  nullable: true
                acceptTerms:
                  type: boolean
                  enum:
                  - true
                referralCode:
                  type: string
                  maxLength: 20
                farmName:
                  type: string
                  minLength: 2
                  maxLength: 120
                buyerType:
                  type: string
                  enum:
                  - RETAILER
                  - FARMER
                  - WHOLESALER
                  - OTHER
                businessName:
                  type: string
                  maxLength: 120
              required:
              - firstname
              - lastname
              - phone
              - email
              - password
              - role
              - acceptTerms
      responses:
        '201':
          description: Utilisateur créé, session ouverte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email ou téléphone déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Connexion (email + mot de passe)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
      responses:
        '200':
          description: Session ouverte (plafond 5 sessions par compte)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Compte suspendu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Rotation du refresh token
      description: Remplace le jeton reçu ; un jeton déjà remplacé est un vol (sauf grâce de 30 s).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
              - refreshToken
      responses:
        '200':
          description: Nouveau accessToken + nouveau refreshToken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Ferme la session de l'appareil (par refresh token)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
              - refreshToken
      responses:
        '200':
          description: Session fermée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Session fermée
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Demande de réinitialisation de mot de passe
      description: Réponse identique que l'adresse existe ou non (anti-énumération).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
      responses:
        '200':
          description: Réponse identique dans tous les cas
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Si cette adresse est enregistrée, un lien de réinitialisation a été envoyé
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/reset-password:
    get:
      tags:
      - Auth
      summary: Affiche le formulaire de réinitialisation
      description: Page HTML servie par l'API ; le GET ne consomme pas le jeton.
      security: []
      parameters:
      - $ref: '#/components/parameters/TokenParam'
      responses:
        '200':
          description: Page HTML du formulaire
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
      - Auth
      summary: Applique le nouveau mot de passe
      description: Détruit toutes les sessions du compte.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  pattern: ^[a-f0-9]{80}$
                password:
                  type: string
                  pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])(?!.*(.)\1\1\1)[A-Za-z\d@$!%*?&]{8,}$
              required:
              - token
              - password
      responses:
        '200':
          description: Mot de passe modifié
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Jeton invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/verify-email:
    get:
      tags:
      - Auth
      summary: Affiche la page de vérification d'adresse
      security: []
      parameters:
      - $ref: '#/components/parameters/TokenParam'
      responses:
        '200':
          description: Page HTML
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
      - Auth
      summary: Vérifie l'adresse (consomme le jeton)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  pattern: ^[a-f0-9]{80}$
              required:
              - token
      responses:
        '200':
          description: Adresse vérifiée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Jeton invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/resend-verification:
    post:
      tags:
      - Auth
      summary: Renvoie le lien de vérification (cooldown 5 min)
      responses:
        '200':
          description: Lien renvoyé si l'adresse n'est pas encore vérifiée
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/sessions:
    get:
      tags:
      - Auth
      summary: Sessions ouvertes du compte connecté
      description: Identifie l'appareil courant par le sessionId du jeton d'accès.
      responses:
        '200':
          description: Liste des sessions avec isCurrent
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions/{id}:
    delete:
      tags:
      - Auth
      summary: Ferme une session du compte
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Session fermée
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout-all:
    post:
      tags:
      - Auth
      summary: Ferme toutes les sessions sauf la courante
      responses:
        '200':
          description: Sessions fermées
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags:
      - Utilisateur
      summary: Profil de l'utilisateur connecté
      description: userToApi + objet profile selon le rôle (SupplierProfile, BuyerProfile, DriverProfile).
      responses:
        '200':
          description: Utilisateur courant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Utilisateur
      summary: Modifie prénom, nom ou localisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                firstname:
                  type: string
                  minLength: 2
                lastname:
                  type: string
                  minLength: 2
                location:
                  type: string
                  nullable: true
                latitude:
                  type: number
                longitude:
                  type: number
      responses:
        '200':
          description: Utilisateur mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me/avatar:
    post:
      tags:
      - Utilisateur
      summary: Téléverse un avatar (multipart)
      description: Remplace l'avatar ; ne supprime jamais un document de vérification.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Image du profil
              required:
              - avatar
      responses:
        '200':
          description: Avatar remplacé
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me/profile:
    patch:
      tags:
      - Utilisateur
      summary: Modifie le profil du rôle (SUPPLIER, BUYER, DRIVER)
      description: 'Le contrôleur sélectionne le schéma du rôle de l''appelant : un SUPPLIER n''a pas à connaître les champs BUYER. Les trois formes acceptées sont listées ci-dessous (celle du rôle de l''appelant fait foi).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  farmName:
                    type: string
                    minLength: 2
                    maxLength: 120
                  description:
                    type: string
                    maxLength: 2000
                    nullable: true
                  zoneId:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                    nullable: true
              - type: object
                properties:
                  buyerType:
                    type: string
                    enum:
                    - RETAILER
                    - FARMER
                    - WHOLESALER
                    - OTHER
                  businessName:
                    type: string
                    maxLength: 120
                    nullable: true
                  zoneId:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                    nullable: true
              - type: object
                properties:
                  vehicleType:
                    type: string
                    maxLength: 50
                    nullable: true
                  plateNumber:
                    type: string
                    maxLength: 20
                    nullable: true
      responses:
        '200':
          description: Profil mis à jour
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: ADMIN/AGENT/ROOT n'ont pas de profil de rôle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/me/payout-accounts:
    get:
      tags:
      - Utilisateur
      summary: Comptes de paiement du connecté (numéros masqués)
      description: SUPPLIER et BUYER uniquement ; accountNumberMasked = "••••1234".
      responses:
        '200':
          description: Liste des comptes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PayoutAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Utilisateur
      summary: Ajoute un compte de paiement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum:
                  - MOBILE_MONEY
                  - BANK_TRANSFER
                  - CASH
                provider:
                  type: string
                  maxLength: 80
                  nullable: true
                accountNumber:
                  type: string
                  minLength: 4
                  maxLength: 64
                accountName:
                  type: string
                  maxLength: 120
                  nullable: true
                isDefault:
                  type: boolean
              required:
              - method
              - accountNumber
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/me/payout-accounts/{id}:
    patch:
      tags:
      - Utilisateur
      summary: Modifie un compte de paiement (partiel)
      parameters:
      - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum:
                  - MOBILE_MONEY
                  - BANK_TRANSFER
                  - CASH
                provider:
                  type: string
                  maxLength: 80
                  nullable: true
                accountNumber:
                  type: string
                  minLength: 4
                  maxLength: 64
                accountName:
                  type: string
                  maxLength: 120
                  nullable: true
                isDefault:
                  type: boolean
      responses:
        '200':
          description: Compte mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Compte d'un autre utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Utilisateur
      summary: Supprime un compte de paiement
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Compte supprimé
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Compte d'un autre utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/me/documents:
    post:
      tags:
      - Utilisateur
      summary: Dépose un document de vérification (multipart)
      description: SUPPLIER et BUYER. Crée VerificationDocument (PENDING) + Media privé (Cloudinary authenticated). Si profileVerificationStatus vaut UNVERIFIED ou REJECTED, il passe à PENDING. La liste ne renvoie jamais d'URL.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: jpeg, png, webp ou pdf, 8 Mo max
                type:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - ID_CARD
                      - BUSINESS_REGISTRATION
                      - FARM_PROOF
                      - OTHER
                  required:
                  - type
              required:
              - file
      responses:
        '201':
          description: Document déposé
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
      - Utilisateur
      summary: Documents du connecté (sans URL)
      responses:
        '200':
          description: Liste id, type, status, note, createdAt — SANS URL
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    type:
                      type: string
                      enum:
                      - ID_CARD
                      - BUSINESS_REGISTRATION
                      - FARM_PROOF
                      - OTHER
                    status:
                      type: string
                      enum:
                      - PENDING
                      - VERIFIED
                      - REJECTED
                    note:
                      type: string
                      nullable: true
                    createdAt:
                      type: string
                      format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me/referral:
    get:
      tags:
      - Utilisateur
      summary: Parrainage du connecté
      description: Code de parrainage et liste des filleuls (le parrain ne voit que le prénom du filleul).
      responses:
        '200':
          description: Code et filleuls
          content:
            application/json:
              schema:
                type: object
                properties:
                  referralCode:
                    type: string
                  referrals:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        kind:
                          type: string
                          enum:
                          - SUPPLIER
                          - BUYER
                        status:
                          type: string
                          enum:
                          - PENDING
                          - APPROVED
                          - REJECTED
                        firstname:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/verifications:
    get:
      tags:
      - Admin
      summary: Dossiers de vérification des profils (paginé)
      description: ADMIN et plus, ou AGENT avec la capacité USER_VERIFICATION. Tri FIFO (le plus ancien d'abord) quand status=PENDING, antéchronologique sinon. La liste n'expose ni URL ni publicId du fichier.
      parameters:
      - in: query
        name: status
        schema:
          type: string
          enum:
          - PENDING
          - VERIFIED
          - REJECTED
      - in: query
        name: type
        schema:
          type: string
          enum:
          - ID_CARD
          - BUSINESS_REGISTRATION
          - FARM_PROOF
          - OTHER
      - in: query
        name: role
        schema:
          type: string
          enum:
          - SUPPLIER
          - BUYER
      - in: query
        name: userId
        schema:
          type: integer
          minimum: 1
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedVerifications'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/verifications/{id}:
    get:
      tags:
      - Admin
      summary: Détail d'un dossier (URL signée Cloudinary, 10 min)
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Détail + URL signée de courte durée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Admin
      summary: Décision d'examen (APPROVE / REJECT)
      description: APPROVE -> document VERIFIED, utilisateur VERIFIED si aucun document PENDING. REJECT sans document VERIFIED -> utilisateur REJECTED. Audit dans la même transaction. Décision atomique : deux relecteurs simultanés obtiennent un 200 et un 409. L'utilisateur est prévenu par email après la décision.
      parameters:
      - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum:
                  - APPROVE
                  - REJECT
                note:
                  anyOf:
                  - type: string
                    minLength: 1
                    maxLength: 2000
                  - type: string
                    maxLength: 2000
                    nullable: true
                  description: 'Conditionnel — si decision vaut REJECT : requis, sinon doit être string'
              required:
              - decision
      responses:
        '200':
          description: Décision appliquée
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Document déjà examiné par un autre relecteur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/files/{token}:
    get:
      tags:
      - Admin
      summary: Télécharge ou affiche un document privé sécurisé
      description: ADMIN et plus, ou AGENT avec la capacité USER_VERIFICATION. Accès via token JWT signé (10 min).
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
        description: Token JWT signé encodant le chemin relatif du document
      responses:
        '200':
          description: Fichier privé streamé (image ou PDF)
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/settings:
    get:
      tags:
      - Admin
      summary: Réglages de la plateforme (ADMIN et plus)
      responses:
        '200':
          description: Settings de la plateforme (singleton id=1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
      - Admin
      summary: Modifie les réglages (ROOT seul)
      description: La commission fournisseur vaut 0 tant qu'elle n'est pas fixée par ROOT. currency est en lecture seule. Au moins un champ obligatoire.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                supplierCommissionRate:
                  type: number
                  minimum: 0
                  maximum: 0.5
                buyerFeeType:
                  type: string
                  enum:
                  - NONE
                  - FIXED
                  - PERCENT
                buyerFeeValue:
                  type: number
                  minimum: 0
                  description: 'Conditionnel — si buyerFeeType vaut PERCENT : doit être number, sinon doit être number'
                transportMarkupRate:
                  type: number
                  minimum: 0
                  maximum: 1
                referralBuyerReward:
                  type: number
                  minimum: 0
                referralSupplierReward:
                  type: number
                  minimum: 0
                reservationHours:
                  type: integer
                  minimum: 1
                  maximum: 168
                expiryCompensationRate:
                  type: number
                  minimum: 0
                  maximum: 1
              minProperties: 1
      responses:
        '200':
          description: Réglages mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
        '400':
          description: Corps vide ou champ hors bornes (currency fournie -> 400)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: ADMIN refusé ; ROOT seul
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users:
    get:
      tags:
      - Admin
      summary: Liste des utilisateurs (ADMIN et plus)
      parameters:
      - in: query
        name: profileVerificationStatus
        schema:
          type: string
          enum:
          - UNVERIFIED
          - PENDING
          - VERIFIED
          - REJECTED
      responses:
        '200':
          description: Tableau d'utilisateurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Admin
      summary: Crée un compte staff (ADMIN, AGENT, DRIVER)
      description: ADMIN réservé à ROOT (403 sinon). AGENT et DRIVER pour ADMIN et ROOT. Unicité email ET téléphone (409). L'email de bienvenue n'est jamais bloquant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstname:
                  type: string
                  minLength: 2
                lastname:
                  type: string
                  minLength: 2
                phone:
                  type: string
                  pattern: ^\+?[0-9]{8,15}$
                email:
                  type: string
                  format: email
                password:
                  type: string
                  pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])(?!.*(.)\1\1\1)[A-Za-z\d@$!%*?&]{8,}$
                role:
                  type: string
                  enum:
                  - ADMIN
                  - AGENT
                  - DRIVER
                agent:
                  type: object
                  properties:
                    displayName:
                      type: string
                    capabilities:
                      type: array
                      items:
                        type: string
                      uniqueItems: true
                  description: 'Conditionnel — si role vaut AGENT : doit être object, sinon interdit'
                driver:
                  type: object
                  properties:
                    agencyId:
                      type: integer
                      minimum: 0
                      exclusiveMinimum: true
                    vehicleType:
                      type: string
                      maxLength: 50
                      nullable: true
                    plateNumber:
                      type: string
                      maxLength: 20
                      nullable: true
                  required:
                  - agencyId
                  description: 'Conditionnel — si role vaut DRIVER : doit être object, sinon interdit'
              required:
              - firstname
              - lastname
              - phone
              - email
              - password
              - role
      responses:
        '201':
          description: Compte créé avec son profil
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Création d'un ADMIN par un non-ROOT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email ou téléphone déjà utilisé (codes distincts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
