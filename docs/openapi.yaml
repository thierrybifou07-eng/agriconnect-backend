  /supplier/lots:
    post:
      tags:
      - Fournisseur
      summary: Déclare un lot (multipart)
      description: "Crée le lot en PENDING_VALIDATION (lotCode = 'LOT-' + id sur 6 chiffres) et ses photos (ownerLotId). expiresAt obligatoire si le produit est périssable (vérifié par le contrôleur). hubId obligatoire si HUB ; pickupAddress + coordonnées obligatoires si SUPPLIER_SITE. Exige un profil vérifié : 403 PROFILE_NOT_VERIFIED (renvoyé avant l'écriture des fichiers) tant que profileVerificationStatus n'est pas VERIFIED."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: string
                  format: binary
                  description: 'Jusqu''à 5 photos dans le champ "images" : jpeg, png ou webp, 5 Mo max par photo'
                productId:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                zoneId:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                agreedUnitPrice:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                quantity:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                storageType:
                  type: string
                  enum:
                  - SUPPLIER_SITE
                  - HUB
                hubId:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                pickupAddress:
                  type: string
                pickupLatitude:
                  type: number
                  minimum: -90
                  maximum: 90
                pickupLongitude:
                  type: number
                  minimum: -180
                  maximum: 180
                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
                harvestedAt:
                  type: string
                  format: date-time
                  nullable: true
                packagingNote:
                  type: string
                  maxLength: 500
                  nullable: true
                qualityNote:
                  type: string
                  maxLength: 500
                  nullable: true
              required:
              - images
              - productId
              - zoneId
              - agreedUnitPrice
              - quantity
              - storageType
      responses:
        '201':
          description: Lot créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierLot'
        '400':
          $ref: '#/components/responses/UploadBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenProfileNotVerified'
        '413':
          $ref: '#/components/responses/FileTooLarge'
    get:
      tags:
      - Fournisseur
      summary: Lots du fournisseur connecté (paginé)
      parameters:
      - in: query
        name: status
        schema:
          type: string
          enum:
          - PENDING_VALIDATION
          - AVAILABLE
          - FULLY_RESERVED
          - SOLD_OUT
          - EXPIRED
          - RETURNED
          - REJECTED
          - WITHDRAWN
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedSupplierLots'
        '400':
          description: Statut inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
