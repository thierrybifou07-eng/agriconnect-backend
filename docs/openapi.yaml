  /staff/orders:
    post:
      tags:
      - Équipe
      summary: Émet un devis pour un acheteur
      description: 'ORDER_PROCESSING (AGENT) ou ADMIN/ROOT. Réserve le stock et fige les prix. HUB_PICKUP exige pickupHubId ; AGENCY_DELIVERY exige delivery.{zoneId, address, latitude, longitude}. Lignes OrderItem : listingId + lotId + prix.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                buyerId:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                conversationId:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      listingId:
                        type: integer
                        minimum: 0
                        exclusiveMinimum: true
                      quantity:
                        type: number
                        minimum: 0
                        exclusiveMinimum: true
                      unitPrice:
                        type: number
                        minimum: 0
                        exclusiveMinimum: true
                    required:
                    - listingId
                    - quantity
                  minItems: 1
                deliveryMode:
                  type: string
                  enum:
                  - HUB_PICKUP
                  - AGENCY_DELIVERY
                pickupHubId:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                delivery:
                  type: object
                  properties:
                    zoneId:
                      type: integer
                      minimum: 0
                      exclusiveMinimum: true
                    address:
                      type: string
                      minLength: 3
                      maxLength: 500
                    latitude:
                      type: number
                      minimum: -90
                      maximum: 90
                    longitude:
                      type: number
                      minimum: -180
                      maximum: 180
                  required:
                  - zoneId
                  - address
                  - latitude
                  - longitude
                notes:
                  type: string
                  maxLength: 1000
                  nullable: true
                force:
                  type: boolean
              required:
              - buyerId
              - items
              - deliveryMode
      responses:
        '201':
          description: Devis créé (QUOTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: AGENT sans ORDER_PROCESSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Annonce, acheteur ou conversation introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Stock insuffisant (INSUFFICIENT_STOCK), prix sous le convenu (PRICE_BELOW_SUPPLIER), zone non couverte (ZONE_NOT_COVERED), hub invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
      - Équipe
      summary: Commandes (paginé)
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedOrders'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
