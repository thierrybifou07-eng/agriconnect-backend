      description: La commission fournisseur vaut 0 tant qu'elle n'est pas fixée par ROOT. currency est en lecture seule. Au moins un champ obligatoire.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                supplierCommissionRate:
                  type: number
                  minimum: 0
                  maximum: 0.5
                buyerFeeType:
                  type: string
                  enum:
                  - NONE
                  - FIXED
                  - PERCENT
                buyerFeeValue:
                  type: number
                  minimum: 0
                  description: 'Conditionnel — si buyerFeeType vaut PERCENT : doit être number, sinon doit être number'
                transportMarkupRate:
                  type: number
                  minimum: 0
                  maximum: 1
                referralBuyerReward:
                  type: number
                  minimum: 0
                referralSupplierReward:
                  type: number
                  minimum: 0
                reservationHours:
                  type: integer
                  minimum: 1
                  maximum: 168
                expiryCompensationRate:
                  type: number
                  minimum: 0
                  maximum: 1
              minProperties: 1
      responses:
        '200':
          description: Réglages mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
        '400':
          description: Corps vide ou champ hors bornes (currency fournie -> 400)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: ADMIN refusé ; ROOT seul
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users:
    get:
      tags:
      - Admin
      summary: Liste des utilisateurs (ADMIN et plus)
      parameters:
      - in: query
        name: role
        schema:
          type: string
          enum:
          - ROOT
          - ADMIN
          - AGENT
          - SUPPLIER
          - BUYER
