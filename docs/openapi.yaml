          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /staff/orders/{id}/payments:
    post:
      tags:
      - Équipe
      summary: Enregistre un paiement manuel (idempotent)
      description: PAYMENT_FOLLOWUP (AGENT humain) ou ADMIN/ROOT. En-tête Idempotency-Key obligatoire.
      parameters:
      - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                method:
                  type: string
                  enum:
                  - CASH
                  - MOBILE_MONEY
                  - BANK_TRANSFER
                reference:
                  type: string
                  maxLength: 200
                  nullable: true
                paidAt:
                  type: string
                  format: date-time
              required:
              - amount
              - method
      responses:
        '201':
          description: Paiement enregistré
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Agent IA refusé (requireHumanActor)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Montant invalide (INVALID_AMOUNT) ou doublon d'idempotence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
