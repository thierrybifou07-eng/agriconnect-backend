                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                pickupAddress:
                  type: string
                pickupLatitude:
                  type: number
                  minimum: -90
                  maximum: 90
                pickupLongitude:
                  type: number
                  minimum: -180
                  maximum: 180
                expiresAt:
                  type: string
                  format: date-time
