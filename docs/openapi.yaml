          description: Livraisons créées
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Commande introuvable (ORDER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Mode invalide (INVALID_DELIVERY_MODE), statut invalide (INVALID_ORDER_STATUS) ou livraisons existantes (DELIVERIES_ALREADY_CREATED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /staff/deliveries:
    get:
      tags:
      - Équipe
      summary: Livraisons (paginé)
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedDeliveries'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /staff/deliveries/{id}/release:
    post:
      tags:
      - Équipe
      summary: Libère une course acceptée (ACCEPTED -> PENDING)
      parameters:
      - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '200':
          description: Course libérée
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Livraison introuvable (DELIVERY_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Transition interdite (INVALID_STATE_TRANSITION)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /staff/deliveries/{id}/redispatch:
    post:
      tags:
      - Équipe
      summary: Redispatch une course échouée (FAILED -> PENDING)
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Course redispatchée
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transition interdite (INVALID_STATE_TRANSITION)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /staff/deliveries/{id}/cancel:
    post:
      tags:
      - Équipe
      summary: Annule une course (PENDING, ACCEPTED ou FAILED -> CANCELLED)
      description: La raison est obligatoire (audit DELIVERY_CANCELLED).
      parameters:
      - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
              required:
              - reason
      responses:
        '200':
          description: Course annulée
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transition interdite (INVALID_STATE_TRANSITION)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /staff/compensations:
    post:
      tags:
      - Équipe
      summary: Demande une indemnisation fournisseur (invendus ou pertes)
      description: DISPUTE_HANDLING (AGENT) ou ADMIN/ROOT. Quantité > lot -> 400 du service. Rate à 0 -> COMPENSATION_RATE_ZERO si non fixée.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lotId:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                reason:
                  type: string
                  enum:
                  - EXPIRED_UNSOLD
                  - LOST_OR_DAMAGED
                  - OTHER
                quantity:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                deliveryId:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  nullable: true
                note:
                  type: string
                  maxLength: 500
                  nullable: true
              required:
              - lotId
              - reason
              - quantity
      responses:
        '201':
          description: Indemnisation créée (PENDING)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Taux nul (COMPENSATION_RATE_ZERO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /catalog/categories:
    get:
      tags:
      - Catalogue
      summary: Catégories (acheteur, équipe)
      description: BUYER, AGENT, ADMIN, ROOT. SUPPLIER et DRIVER exclus.
      responses:
        '200':
          description: Catégories actives
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /catalog/listings:
    get:
      tags:
      - Catalogue
      summary: Annonces visibles (ACTIVE)
      description: 'Le catalogue acheteur n''utilise PAS les lots : il utilise les annonces. Une annonce SOLD ou INACTIVE n''y figure plus.'
      parameters:
      - in: query
        name: categoryId
        schema:
          type: integer
      - in: query
        name: productId
        schema:
          type: integer
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedCatalogListings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /catalog/listings/{id}:
    get:
      tags:
      - Catalogue
      summary: Détail d'une annonce (DTO acheteur)
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Annonce avec produit, photos et prix public
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogListing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
