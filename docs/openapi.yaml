        name: profileVerificationStatus
        schema:
          type: string
          enum:
          - UNVERIFIED
          - PENDING
          - VERIFIED
          - REJECTED
      responses:
        '200':
          description: Tableau d'utilisateurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Admin
      summary: Crée un compte staff (ADMIN, AGENT, DRIVER)
      description: ADMIN réservé à ROOT (403 sinon). AGENT et DRIVER pour ADMIN et ROOT. Unicité email ET téléphone (409). L'email de bienvenue n'est jamais bloquant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstname:
                  type: string
                  minLength: 2
                lastname:
                  type: string
                  minLength: 2
                phone:
                  type: string
                  pattern: ^\+?[0-9]{8,15}$
                email:
                  type: string
                  format: email
                password:
                  type: string
                  pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])(?!.*(.)\1\1\1)[A-Za-z\d@$!%*?&]{8,}$
                role:
                  type: string
                  enum:
                  - ADMIN
                  - AGENT
                  - DRIVER
                agent:
                  type: object
                  properties:
                    displayName:
                      type: string
                    capabilities:
                      type: array
                      items:
                        type: string
                      uniqueItems: true
                  description: 'Conditionnel — si role vaut AGENT : doit être object, sinon interdit'
                driver:
                  type: object
                  properties:
                    agencyId:
                      type: integer
                      minimum: 0
                      exclusiveMinimum: true
                    vehicleType:
                      type: string
                      maxLength: 50
                      nullable: true
                    plateNumber:
                      type: string
                      maxLength: 20
                      nullable: true
                  required:
                  - agencyId
                  description: 'Conditionnel — si role vaut DRIVER : doit être object, sinon interdit'
              required:
              - firstname
              - lastname
              - phone
              - email
              - password
              - role
      responses:
        '201':
          description: Compte créé avec son profil
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Création d'un ADMIN par un non-ROOT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email ou téléphone déjà utilisé (codes distincts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
