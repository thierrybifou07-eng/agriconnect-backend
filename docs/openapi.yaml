          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /conversations:
    post:
      tags:
      - Conversations
      summary: Ouvre une conversation avec son premier message
      description: listingId ou lotId selon le rôle ; envoyer les deux est refusé explicitement par le contrôleur, pas ignoré en silence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                listingId:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                lotId:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                content:
                  type: string
                  minLength: 1
                  maxLength: 5000
              required:
              - content
      responses:
        '201':
          description: Conversation créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Référence introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
      - Conversations
      summary: Conversations du connecté
      responses:
        '200':
          description: Conversations de l'utilisateur (ou de l'équipe pour un agent)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /conversations/{id}/messages:
    get:
      tags:
      - Conversations
      summary: Messages du fil public
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Messages (fil public)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Conversations
      summary: Répond au fil public
      parameters:
      - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 5000
              required:
              - content
      responses:
        '201':
          description: Message envoyé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders:
    get:
      tags:
      - Commandes
      summary: Commandes de l'acheteur connecté
      responses:
        '200':
          $ref: '#/components/responses/PaginatedOrders'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /orders/{id}:
    get:
      tags:
      - Commandes
      summary: Détail d'une commande (404 si pas la sienne)
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Commande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{id}/confirm:
    post:
      tags:
      - Commandes
      summary: Confirme un devis (QUOTED -> CONFIRMED)
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Commande confirmée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transition interdite (INVALID_STATE_TRANSITION)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders/{id}/cancel:
    post:
      tags:
      - Commandes
      summary: Annule un devis ou une commande (restitue le stock)
      parameters:
      - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  nullable: true
      responses:
        '200':
          description: Commande annulée
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transition interdite (INVALID_STATE_TRANSITION)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /driver/deliveries/available:
    get:
      tags:
      - Livreur
      summary: Courses disponibles (PENDING, non assignées)
      responses:
        '200':
          description: Courses disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Delivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /driver/deliveries/mine:
    get:
      tags:
      - Livreur
      summary: Courses du livreur connecté
      responses:
        '200':
          description: Courses du livreur
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Delivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /driver/deliveries/{id}/accept:
    post:
      tags:
      - Livreur
      summary: Accepte une course (PENDING -> ACCEPTED)
      description: Premier arrivé, premier servi. Livreur déjà en course -> 409 DELIVERY_ALREADY_ACTIVE.
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Course acceptée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Course introuvable (DELIVERY_NOT_FOUND) ou déjà prise (DELIVERY_ALREADY_TAKEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Course déjà prise (DELIVERY_ALREADY_TAKEN) ou livreur en course (DELIVERY_ALREADY_ACTIVE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /driver/deliveries/{id}/status:
    patch:
      tags:
      - Livreur
      summary: Fait avancer sa course
      description: FAILED exige failureReason.
      parameters:
      - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - PICKED_UP
                  - IN_TRANSIT
                  - DELIVERED
                  - FAILED
                failureReason:
                  type: string
                  maxLength: 500
                  description: 'Conditionnel — si status vaut FAILED : requis, sinon optionnel'
              required:
              - status
      responses:
        '200':
          description: Statut mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Course introuvable (DELIVERY_NOT_FOUND) ou pas au livreur (NOT_DELIVERY_OWNER)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Transition interdite (INVALID_STATE_TRANSITION)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token JWT — en-tête Authorization: Bearer <token>'
  parameters:
    IdParam:
      in: path
      name: id
      required: true
      description: Identifiant entier (coerceIdParam convertit la chaîne)
      schema:
        type: integer
    TokenParam:
      in: query
      name: token
      required: true
      description: Jeton à usage unique (hex de 80 caractères)
      schema:
        type: string
        pattern: ^[a-f0-9]{80}$
    LegalCodeParam:
      in: path
      name: code
      required: true
      schema:
        type: string
        enum:
        - CGU
        - BUYER_TERMS
        - SUPPLIER_CONSIGNMENT_TERMS
    PageParam:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Corps invalide (Joi)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token absent, invalide ou expiré
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Rôle, capacité ou privilège insuffisant ; compte suspendu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaginatedVerifications:
      description: Dossiers paginés { items, page, limit, total }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedPayouts:
      description: Reversements paginés
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedCategories:
      description: Catégories paginées
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedUnits:
      description: Unités paginées
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedProducts:
      description: Produits paginés
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedZones:
      description: Zones paginées
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedHubs:
      description: Points de dépôt paginés
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedAgencies:
      description: Agences paginées
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedSupplierLots:
      description: Lots du fournisseur paginés
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedSupplierCompensations:
      description: Indemnisations du fournisseur paginées
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedStaffLots:
      description: Lots (tous fournisseurs) paginés
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedStaffListings:
      description: Annonces paginées
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedConversations:
      description: Conversations paginées
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedOrders:
      description: Commandes paginées
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedReferrals:
      description: Parrainages paginés
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedCompensations:
      description: Indemnisations (admin) paginées
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedDeliveries:
      description: Livraisons paginées
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedCatalogListings:
      description: Annonces du catalogue paginées
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
    PaginatedAuditLogs:
      description: Journal d'audit paginé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Message en français
        code:
          type: string
          description: Code MAJUSCULES_AVEC_UNDERSCORES quand l'erreur en porte un
          example: INSUFFICIENT_STOCK
    Paginated:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
    AuthResult:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        refreshToken:
          type: string
    Role:
      type: object
      properties:
        code:
          type: string
          enum:
          - ROOT
          - ADMIN
          - AGENT
          - SUPPLIER
          - BUYER
          - DRIVER
        label:
          type: string
        level:
          type: integer
          description: 10 opérationnel, 30 AGENT, 50 ADMIN, 100 ROOT
        isActive:
          type: boolean
    UserStatus:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
        isActive:
          type: boolean
    User:
      type: object
      properties:
        id:
          type: integer
        firstname:
          type: string
        lastname:
          type: string
        email:
          type: string
        phone:
          type: string
        location:
          type: string
          nullable: true
        emailVerified:
          type: boolean
        profileVerificationStatus:
          type: string
          enum:
          - UNVERIFIED
          - PENDING
          - VERIFIED
          - REJECTED
          description: Distinct de emailVerified — vérification du profil par l'équipe
        referralCode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        role:
          $ref: '#/components/schemas/Role'
        userStatus:
          $ref: '#/components/schemas/UserStatus'
        profile:
          description: SupplierProfile, BuyerProfile ou DriverProfile selon le rôle ; sinon null
          oneOf:
          - $ref: '#/components/schemas/SupplierProfile'
          - $ref: '#/components/schemas/BuyerProfile'
          - $ref: '#/components/schemas/DriverProfile'
    SupplierProfile:
      type: object
      properties:
        id:
          type: integer
        farmName:
          type: string
        description:
          type: string
          nullable: true
        zoneId:
          type: integer
          nullable: true
    BuyerProfile:
      type: object
      properties:
        id:
          type: integer
        buyerType:
          type: string
          enum:
          - RETAILER
          - FARMER
          - WHOLESALER
          - OTHER
        businessName:
          type: string
          nullable: true
        zoneId:
          type: integer
          nullable: true
    DriverProfile:
      type: object
      properties:
        id:
          type: integer
        vehicleType:
          type: string
          nullable: true
        plateNumber:
          type: string
          nullable: true
    Session:
      type: object
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
        isCurrent:
          type: boolean
    PayoutAccount:
      type: object
      properties:
        id:
          type: integer
        method:
          type: string
          enum:
          - MOBILE_MONEY
          - BANK_TRANSFER
          - CASH
        provider:
          type: string
          nullable: true
        accountNumberMasked:
          type: string
          description: '"••••1234" — le numéro complet n''est jamais renvoyé par l''API'
        accountName:
          type: string
          nullable: true
        isDefault:
          type: boolean
    PlatformSettings:
      type: object
      properties:
        id:
          type: integer
        supplierCommissionRate:
          type: number
          description: 0 tant que ROOT ne l'a pas fixée
        buyerFeeType:
          type: string
          enum:
          - NONE
          - FIXED
          - PERCENT
