        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /staff/orders/{id}/status:
    patch:
      tags:
      - Équipe
      summary: Change le statut d'une commande (manuel)
      description: OUT_FOR_DELIVERY n'est posable que par le flux livraison. force = dérogation admin (paiement avant PREPARING).
      parameters:
      - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - CONFIRMED
                  - PREPARING
                  - READY_FOR_PICKUP
                  - OUT_FOR_DELIVERY
                  - COMPLETED
                  - CANCELLED
                force:
                  type: boolean
              required:
              - status
      responses:
        '200':
          description: Statut mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transition interdite (INVALID_STATE_TRANSITION)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /staff/orders/{id}/confirm:
    post:
      tags:
      - Équipe
