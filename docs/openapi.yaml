        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transition interdite (INVALID_STATE_TRANSITION)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /staff/orders/{id}/cancel:
