  /staff/listings:
    post:
      tags:
      - Équipe
      summary: Publie une annonce à partir d'un lot validé
      description: LISTING_MANAGEMENT (AGENT) ou ADMIN/ROOT. Au MVP une annonce = EXACTEMENT UN lot (400 sinon). Lot déjà relié -> 409 LOT_ALREADY_LINKED. Prix public par défaut = prix convenu. Référence 'ANN-' + id sur 6 chiffres.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: string
                  format: binary
                  description: Photos de l'annonce, 5 maximum (absentes -> photos du lot copiées)
                lotIds:
                  type: array
                  items:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                title:
                  type: string
                  minLength: 3
                  maxLength: 140
                description:
                  type: string
                  maxLength: 2000
                  nullable: true
                unitPrice:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                zoneId:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
              required:
              - images
              - lotIds
              - title
      responses:
        '201':
          description: Annonce créée (DRAFT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffListing'
        '400':
          description: Plusieurs lots ou champ invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: AGENT sans LISTING_MANAGEMENT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lot déjà relié (LOT_ALREADY_LINKED) ou indisponible (LOT_NOT_AVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
      - Équipe
      summary: Annonces de l'équipe (paginé)
      parameters:
      - in: query
        name: status
        schema:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - SOLD
          - INACTIVE
      - in: query
        name: productId
        schema:
          type: integer
      - in: query
        name: supplierId
        schema:
          type: integer
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedStaffListings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
