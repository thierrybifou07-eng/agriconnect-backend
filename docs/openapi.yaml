      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/Delivery'
              page:
                type: integer
              limit:
                type: integer
              total:
                type: integer
    PaginatedCatalogListings:
      description: Annonces du catalogue paginées
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogListing'
              page:
                type: integer
