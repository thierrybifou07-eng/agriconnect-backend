                type: integer
              total:
                type: integer
    PaginatedAuditLogs:
      description: Journal d'audit paginé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paginated'
  schemas:
    AiSuggestion:
      type: object
      required:
      - id
      - kind
      - status
      - conversationId
      - lotId
      - agent
      - model
      - latencyMs
      - payload
      - error
      - decidedAt
      - executedAt
      - createdAt
      properties:
        id:
          type: integer
        kind:
          type: string
          enum:
          - REPLY
          - TRIAGE
          - LISTING_DRAFT
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - EXECUTED
          - FAILED
          - EXPIRED
        conversationId:
          type: integer
          nullable: true
        lotId:
          type: integer
          nullable: true
        agent:
          type: object
          required:
          - id
          - displayName
          properties:
            id:
              type: integer
            displayName:
              type: string
        model:
          type: string
        latencyMs:
          type: integer
          nullable: true
        payload:
          type: object
          nullable: true
          additionalProperties: true
        error:
          type: string
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        executedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error:
          type: string
          description: Message en français
        code:
          type: string
          description: Codes stables d’authentification et d’autorisation, de limitation, et d’erreurs du moteur IA / cycle des suggestions.
          example: TOKEN_INVALID
        details:
          type: array
          description: Détails de validation Joi (présent sur les erreurs 400)
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    ProfileNotVerifiedError:
      type: object
      properties:
        error:
          type: string
          description: Message en français
        code:
          type: string
          example: PROFILE_NOT_VERIFIED
        profileVerificationStatus:
          type: string
          enum:
          - UNVERIFIED
          - PENDING
          - VERIFIED
          - REJECTED
    UploadError:
      type: object
      properties:
        error:
          type: string
          description: Message en français nommant le champ attendu
        code:
          type: string
          enum:
          - UNEXPECTED_FILE_FIELD
          - INVALID_MULTIPART
          - UNSUPPORTED_MEDIA_TYPE
          - FILE_REQUIRED
          - FILE_CONTENT_MISMATCH
          - FILE_TOO_LARGE
          example: UNEXPECTED_FILE_FIELD
        expectedField:
          type: string
          description: Champ multipart attendu (avatar, file ou images) — renvoyé avec UNEXPECTED_FILE_FIELD
    Paginated:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
    AuthResult:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        refreshToken:
          type: string
    Role:
      type: object
      properties:
        code:
          type: string
          enum:
          - ROOT
          - ADMIN
          - AGENT
          - SUPPLIER
          - BUYER
          - DRIVER
        label:
          type: string
    UserStatus:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
        firstname:
          type: string
        lastname:
          type: string
